name: CI/CD For KAVI Backend

on:
  push:
    branches: [ prod ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: docker build -t eyadn/lodestar-tech-kavi-backend:latest .

    - name: Push Docker image
      run: docker push eyadn/lodestar-tech-kavi-backend:latest
